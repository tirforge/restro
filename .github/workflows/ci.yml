name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restro_test
      AUTH_SECRET: ci-only-secret-not-for-production-1234567890
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Prisma 7 requires Node 20.19+ / 22.12+ / 24+
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Seed smoke fixture
        run: npx tsx scripts/ci-smoke-seed.ts | grep SMOKE_TABLE_ID >> "$GITHUB_ENV"

      - name: Smoke — OTP mode (table → login gate → no menu yet)
        run: |
          pkill -f "[n]ext-server" || true
          (npm start -- --port 3000 > /tmp/smoke-otp.log 2>&1 & echo $! > /tmp/smoke.pid)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          check() { # check <label> <url> <pattern>
            local body
            body=$(curl -sf "$2") || { echo "FAIL $1: HTTP error for $2"; return 1; }
            echo "$body" | grep -q "$3" || { echo "FAIL $1: pattern '$3' missing. Got: $(echo "$body" | head -c 400)"; return 1; }
            echo "PASS $1"
          }
          check "home" http://localhost:3000/ "Staff Login"
          check "staff-login" http://localhost:3000/u/demo-restaurant/login "Smoke Waiter"
          check "table-picker" http://localhost:3000/order/demo-restaurant "Which table are you sitting at"
          BODY=$(curl -sf "http://localhost:3000/order/demo-restaurant?table=${SMOKE_TABLE_ID}")
          echo "$BODY" | grep -q "Verify your phone" || { echo "FAIL gate: no OTP gate. Got: $(echo "$BODY" | head -c 400)"; exit 1; }
          echo "PASS otp-gate"
          # NOTE: menu item names travel in the RSC payload (props) even when
          # the menu isn't rendered, so the leak signal is the order button.
          echo "$BODY" | grep -q "Place order" && { echo "FAIL gate: menu leaked before login"; exit 1; } || echo "PASS menu-hidden"
          kill "$(cat /tmp/smoke.pid)"

      - name: Smoke — walk-in mode (table → menu, no login)
        env:
          GUEST_OTP_DISABLED: "true"
        run: |
          pkill -f "[n]ext-server" || true
          (npm start -- --port 3000 > /tmp/smoke-walkin.log 2>&1 & echo $! > /tmp/smoke.pid)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          BODY=$(curl -sf "http://localhost:3000/order/demo-restaurant?table=${SMOKE_TABLE_ID}")
          echo "$BODY" | grep -q "Smoke Thali" || { echo "FAIL walkin: no menu. Got: $(echo "$BODY" | head -c 400)"; exit 1; }
          echo "PASS walkin-menu"
          echo "$BODY" | grep -q "Place order" || { echo "FAIL walkin: no order button"; exit 1; }
          echo "PASS walkin-order-button"
          echo "$BODY" | grep -q "Verify your phone" && { echo "FAIL walkin: login gate shown"; exit 1; } || echo "PASS no-gate"
          kill "$(cat /tmp/smoke.pid)"

      - name: Stop smoke server
        if: always()
        run: pkill -f "[n]ext-server" || true
