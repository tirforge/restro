name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restro_test
      AUTH_SECRET: ci-only-secret-not-for-production-1234567890
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Prisma 7 requires Node 20.19+ / 22.12+ / 24+
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Seed smoke fixture
        run: npx tsx scripts/ci-smoke-seed.ts | grep SMOKE_TABLE_ID >> "$GITHUB_ENV"

      - name: Smoke — OTP mode (table → login gate → no menu yet)
        run: |
          pkill -f "[n]ext-server" || true
          (npm start -- --port 3000 > /tmp/smoke-otp.log 2>&1 & echo $! > /tmp/smoke.pid)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ | grep -q "Staff Login"
          curl -sf http://localhost:3000/u/demo-restaurant/login > /dev/null
          curl -sf http://localhost:3000/order/demo-restaurant | grep -q "Which table are you sitting at"
          BODY=$(curl -sf "http://localhost:3000/order/demo-restaurant?table=${SMOKE_TABLE_ID}")
          echo "$BODY" | grep -q "Verify your phone"
          echo "$BODY" | grep -q "Smoke Thali" && exit 1 || true
          kill "$(cat /tmp/smoke.pid)"

      - name: Smoke — walk-in mode (table → menu, no login)
        env:
          GUEST_OTP_DISABLED: "true"
        run: |
          pkill -f "[n]ext-server" || true
          (npm start -- --port 3000 > /tmp/smoke-walkin.log 2>&1 & echo $! > /tmp/smoke.pid)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          BODY=$(curl -sf "http://localhost:3000/order/demo-restaurant?table=${SMOKE_TABLE_ID}")
          echo "$BODY" | grep -q "Smoke Thali"
          echo "$BODY" | grep -q "Place order"
          echo "$BODY" | grep -q "Verify your phone" && exit 1 || true
          kill "$(cat /tmp/smoke.pid)"

      - name: Stop smoke server
        if: always()
        run: pkill -f "[n]ext-server" || true
